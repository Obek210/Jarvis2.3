name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate project files from jarvis_toibot.py
        run: python3 jarvis_toibot.py

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build_output.log || {
            echo "=== KOTLIN / GRADLE ERRORS ==="
            grep -n -C 2 "e: " build_output.log || true
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
